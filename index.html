<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      页面图标：源自用户提供的 yggdrasil.png（1254x1254 金树，放大裁切版），
      用 Pillow 缩成 256 / 180 / 32 三档并做调色板量化（1287 KB 原图 -> 6 KB）。
      大档给普通标签页与高分屏，32 给老式标签页，180 给 iOS 加到主屏。
      ?v= 是给 favicon 用的：文件名不变时浏览器会一直拿缓存里的旧图，
      换图就把这个数字加一（普通刷新对 favicon 常常不起作用）。
    -->
    <link rel="icon" type="image/png" sizes="256x256" href="/yggdrasil.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/yggdrasil-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/yggdrasil-180.png?v=2" />
    <title>Yggdrasil</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
